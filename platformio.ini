; APRS Map Viewer - M5Stack Basic port (ILI9342C)
; m5 v1 = diagnostic (colour/flash/buttons, all confirmed 2026-11-11)
; m5 v2 = full port of the 2432S028 v78 (buttons instead of touch)
[env:m5stack-basic]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_mapgen.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

lib_deps =
    lovyan03/LovyanGFX@^1.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
